name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      year:
        description: Year to generate
        required: true
        default: "2026-2027"
      rebuild:
        description: Recalculate every chart
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      DATA_YEAR: ${{ inputs.year || '2026-2027' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Generate database and site
        run: |
          npm ci
          python3 -m pip install duckdb==1.3.2 pyarrow==19.0.1
          if [ "${{ inputs.rebuild }}" = "true" ]; then
            npm run build -- "$DATA_YEAR"
          else
            node scripts/reuse-verified-data.mjs "$DATA_YEAR" || npm run build -- "$DATA_YEAR"
          fi
      - name: Verify browser workflows
        run: |
          npx playwright install --with-deps chromium
          node scripts/verify-browser.mjs
      - name: Browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-preview
          path: test-results/
      - name: Upload database when verification fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-build-${{ github.run_id }}
          path: data/
          retention-days: 1
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
