<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="bazi" />
    <title>bazi</title>
    <link rel="stylesheet" href="terminal.css?v=12" />
    <link rel="stylesheet" href="visualization.css?v=5" />
    <link rel="stylesheet" href="design.css?v=1" />
    <script>document.documentElement.classList.toggle('dark',localStorage.getItem('bazi.theme')==='dark');</script>
  </head>
  <body>
    <header class="app-bar">
      <a class="brand" href="./" aria-label="bazi 首頁"><span class="brand-mark">八</span><strong>bazi</strong></a>
      <nav class="workspace-tabs" aria-label="工作區">
        <button class="workspace-tab active" data-workspace-tab="database" type="button"><span>▦</span> 資料瀏覽</button>
        <button class="workspace-tab" data-workspace-tab="query" type="button"><span>⌘</span> SQL 查詢</button>
        <button class="workspace-tab" data-workspace-tab="visualization" type="button"><span>◫</span> 吉凶時間軸</button>
      </nav>
      <span id="connectionState">資料庫</span>
      <button id="runSql" class="run-button" type="button" disabled hidden>▶ 執行 <kbd>F5</kbd></button>
      <button id="themeToggle" class="icon-button" type="button" title="切換主題">☾</button>
    </header>

    <div class="app-body" data-workspace="database">
      <aside class="object-explorer">
        <div class="explorer-title">範例查詢 <span id="queryCount"></span></div>
        <div class="query-search-wrap"><input id="querySearch" type="search" placeholder="搜尋查詢" autocomplete="off" /></div>
        <div class="sample-list" id="queryLibrary"></div>
      </aside>

      <main class="workbench">
      <section id="databaseWorkspace" class="workspace-view database-workspace active">
        <div class="browse-loading"><span class="loading-orbit"></span><h1>開啟命盤資料</h1><p id="browseLoadStatus">正在連線至資料庫…</p></div>
      </section>
      <section id="queryWorkspace" class="workspace-view query-workspace">
      <section class="query-pane">
        <div class="pane-tabs">
          <span class="pane-title">SQL</span>
          <span id="queryState">就緒</span>
        </div>
        <div class="editor-wrap">
          <div class="line-numbers" id="lineNumbers">1</div>
          <textarea id="sqlEditor" aria-label="查詢內容" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"></textarea>
          <div id="autocomplete" class="autocomplete" hidden></div>
        </div>
      </section>

      <div class="splitter" aria-hidden="true"></div>

      <section class="result-pane">
        <div class="result-tabs">
          <button class="result-tab active" data-result-tab="results" type="button">結果</button>
          <button class="result-tab" data-result-tab="messages" type="button">訊息</button>
          <span id="resultMeta"></span>
          <button id="exportCsv" type="button" disabled>匯出表格</button>
        </div>
        <div id="resultsView" class="result-view active">
          <div class="data-grid" id="dataGrid">
            <table>
              <thead id="gridHead"></thead>
              <tbody id="gridRows"></tbody>
            </table>
          </div>
        </div>
        <pre id="messagesView" class="result-view messages"></pre>
        <div id="horizontalScroll" class="horizontal-scroll" aria-label="結果水平捲動"><div id="horizontalScrollInner"></div></div>
      </section>
      </section>
      <section id="visualizationWorkspace" class="workspace-view visualization-workspace">
        <div id="visualizationView" class="visualization-view"></div>
      </section>
      </main>
    </div>

    <footer class="status-bar">
      <span id="statusText">載入中…</span>
      <span id="datasetMeta"></span>
    </footer>

    <script src="queryLibrary.js?v=12" defer></script>
    <script src="visualization.js?v=7" defer></script>
    <script src="browser.js?v=1" defer></script>
    <script src="terminal.js?v=19" defer></script>
  </body>
</html>
