<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="bazi" />
    <title>bazi</title>
    <link rel="stylesheet" href="terminal.css?v=8" />
  </head>
  <body>
    <header class="app-bar">
      <strong>bazi</strong>
      <span id="connectionState">SQLite</span>
      <button id="runSql" class="run-button" type="button" disabled>▶ Execute (F5)</button>
      <button id="themeToggle" class="icon-button" type="button" title="Theme">☾</button>
    </header>

    <div class="app-body">
      <aside class="object-explorer">
        <div class="explorer-title">Sample Queries <span id="queryCount"></span></div>
        <div class="query-search-wrap"><input id="querySearch" type="search" placeholder="Search queries" autocomplete="off" /></div>
        <div class="sample-list" id="queryLibrary"></div>
      </aside>

      <main class="workbench">
      <section class="query-pane">
        <div class="pane-tabs">
          <button class="query-tab active" type="button">SQLQuery1.sql</button>
          <span id="queryState">Ready</span>
        </div>
        <div class="editor-wrap">
          <div class="line-numbers" id="lineNumbers">1</div>
          <textarea id="sqlEditor" aria-label="SQL query" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"></textarea>
          <div id="autocomplete" class="autocomplete" hidden></div>
        </div>
      </section>

      <div class="splitter" aria-hidden="true"></div>

      <section class="result-pane">
        <div class="result-tabs">
          <button class="result-tab active" data-result-tab="results" type="button">Results</button>
          <button class="result-tab" data-result-tab="messages" type="button">Messages</button>
          <span id="resultMeta"></span>
          <button id="exportCsv" type="button" disabled>CSV</button>
        </div>
        <div id="resultsView" class="result-view active">
          <div class="data-grid" id="dataGrid">
            <table>
              <thead id="gridHead"></thead>
              <tbody id="gridRows"></tbody>
            </table>
          </div>
        </div>
        <pre id="messagesView" class="result-view messages"></pre>
        <div id="horizontalScroll" class="horizontal-scroll" aria-label="Horizontal result scroll"><div id="horizontalScrollInner"></div></div>
      </section>
      </main>
    </div>

    <footer class="status-bar">
      <span id="statusText">Loading…</span>
      <span id="datasetMeta"></span>
    </footer>

    <script src="queryLibrary.js?v=1" defer></script>
    <script src="terminal.js?v=9" defer></script>
  </body>
</html>
